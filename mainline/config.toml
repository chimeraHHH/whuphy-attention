[paths]
python = "python"
wly_dir = "WLY"
matformer_dir = "Matformer-1"

[wly.preprocess]
input_dir = "dataset_imp2d"
cleaned_output = "cleaned_dataset.pkl"
processed_output = "processed_dataset_with_graphs.pkl"
final_output = "final_dataset.pkl"
cutoff = 5.0
min_target = -20.0
max_target = 20.0
# set to 0 or negative to disable limit
limit = 0

[wly.train]
enabled = true
data = "final_dataset.pkl"
features = "atom_features.pth"
output_dir = "checkpoints"
batch_size = 16
epochs = 25
lr = 0.0001
hidden_dim = 64
n_local = 2
n_global = 1
seed = 42
num_workers = 0
pin_memory = false
fp16 = false
distributed = false
backend = "nccl"

[matformer.train]
enabled = false
task = "both"
epochs = 200
batch_size = 64
lr = 0.001
cutoff = 8.0
max_neighbors = 12
num_workers = 4
output_root = "runs_mainline"
link = "identity"
seed = 123
no_lattice = false
use_angle = false
weighted_loss = false
per_bin_standardize = false
# optional: set to positive values to enable
fermi_sigma = 0.0
fermi_bin_idx = -1
# optional subset ratios: set to > 0 to enable
train_ratio = 0.0
val_ratio = 0.0
test_ratio = 0.0

[baseline]
split_version = "v1"

[baseline.split]
data = "WLY/final_dataset.pkl"
output_root = "mainline/baseline/splits"
manifest_root = "mainline/baseline/manifests"
auto_generate = true
seed = 42
train_ratio = 0.8
val_ratio = 0.1
test_ratio = 0.1
id_keys = ["id", "unique_id", "uid", "mp_id"]
write_toy = true
toy_size = 200

[baseline.pull]
root_dir = "mainline/baseline/third_party"
depth = 1

[baseline.pull.cgcnn]
enabled = true
repo = "https://github.com/txie-93/cgcnn.git"
branch = "master"
dest = "cgcnn"

[baseline.pull.alignn]
enabled = true
repo = "https://github.com/usnistgov/alignn.git"
branch = "main"
dest = "alignn"

[baseline.pull.ours]
enabled = true
path = "mainline"

[baseline.models.ours]
enabled = true
split_version = "v1"
train_output_dir = "WLY/checkpoints_baseline"
eval_ckpt = "best_model.pth"
plot_path = "mainline/baseline/reports/parity_ours_v1.png"
metrics_out = "mainline/baseline/reports/metrics_ours_v1.json"

[baseline.models.cgcnn]
enabled = true
workdir = "mainline/baseline/third_party/cgcnn"
train_cmd = [
  "python",
  "{root}/mainline/baseline/baseline_runner.py",
  "--model",
  "cgcnn",
  "--action",
  "train",
  "--split_dir",
  "{split_dir}",
  "--split_version",
  "{split_version}",
  "--cgcnn_epochs",
  "{cgcnn_epochs}"
]
eval_cmd = [
  "python",
  "{root}/mainline/baseline/baseline_runner.py",
  "--model",
  "cgcnn",
  "--action",
  "eval",
  "--split_dir",
  "{split_dir}",
  "--split_version",
  "{split_version}"
]

[baseline.models.alignn]
enabled = true
workdir = "mainline/baseline/third_party/alignn"
train_cmd = [
  "python",
  "{root}/mainline/baseline/baseline_runner.py",
  "--model",
  "alignn",
  "--action",
  "train",
  "--split_dir",
  "{split_dir}",
  "--split_version",
  "{split_version}",
  "--alignn_epochs",
  "{alignn_epochs}"
]
eval_cmd = [
  "python",
  "{root}/mainline/baseline/baseline_runner.py",
  "--model",
  "alignn",
  "--action",
  "eval",
  "--split_dir",
  "{split_dir}",
  "--split_version",
  "{split_version}"
]
